name: tests

# Gate layer 10: the suite has to pass on Windows and Linux, on both target frameworks. The Linux job is
# the half that cannot be verified on the development machine, so it lives here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / net${{ matrix.framework }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        framework: ['8.0', '9.0']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.framework }}.x

      - name: Restore
        run: dotnet restore

      - name: Build engine and tests
        run: |
          dotnet build src/Xod/Xod.csproj -c Release --nologo
          dotnet build tests/Xod.CrashWriter/Xod.CrashWriter.csproj -c Release --nologo

      - name: Test
        run: dotnet test tests/Xod.Tests/Xod.Tests.csproj -c Release --nologo -f net${{ matrix.framework }}

      # The conformance set (PLAN-047): the library against the committed cases and fixtures.
      - name: Conformance cases
        run: dotnet test conformance/Xod.Conformance/Xod.Conformance.csproj -c Release --nologo -f net${{ matrix.framework }}

      # The file-format half: an independent reader (Node, no packages) reads every fixture.
      - name: Conformance file format
        if: matrix.framework == '9.0'
        run: node conformance/format/read.mjs --check

      # The same dataset as the library in the tree writes it today must read the same, with keys v2.
      - name: Conformance fresh write
        if: matrix.framework == '9.0'
        run: |
          dotnet run --project conformance/Xod.Conformance/Xod.Conformance.csproj -c Release -f net9.0 -- data "${{ runner.temp }}/fresh"
          dotnet run --project conformance/Xod.Conformance/Xod.Conformance.csproj -c Release -f net9.0 -- stored-values "${{ runner.temp }}/fresh"
          node conformance/format/read.mjs --check-fresh "${{ runner.temp }}/fresh"

      # The stress harness writes the files the site publishes; these pin what those files must say.
      - name: Stress harness tests
        if: matrix.framework == '9.0'
        run: dotnet test benchmarks/XodBench.Tests/XodBench.Tests.csproj -c Release --nologo
