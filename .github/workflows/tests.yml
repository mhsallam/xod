name: tests

# Gate layer 10: the suite has to pass on Windows and Linux, on both target frameworks. The Linux job is
# the half that cannot be verified on the development machine, so it lives here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / net${{ matrix.framework }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        framework: ['8.0', '9.0']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.framework }}.x

      # The gate (tools/gate.mjs): the same steps a local run makes, so the two can't drift apart
      # (ISS-158). Builds treat a warning as an error; the file format, the stress harness and the
      # machine-details check run with 9.0.
      - name: Gate
        run: node tools/gate.mjs --framework ${{ matrix.framework }}
